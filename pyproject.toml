[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "callguard-npu"
version = "1.0.0"
description = "Zero-Trust Multi-Modal Biometric & Acoustic Verification Shield for Snapdragon-Powered HP PCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CallGuard Engineering Team" }
]
keywords = [
    "deepfake-detection",
    "snapdragon",
    "qualcomm-npu",
    "zero-trust",
    "rppg",
    "audio-forensics",
    "accessibility"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Multimedia :: Video"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "onnxruntime>=1.17.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
snapdragon = [
    "onnxruntime-qnn>=1.17.0"
]

[project.scripts]
callguard = "callguard.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["callguard*"]
